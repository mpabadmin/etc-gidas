<style>
:root{--bg:#F7F6F2;--card:#fff;--line:#E2E0D8;--tx:#2C2C2A;--tx2:#5F5E5A;--acc:#0C447C;--accbg:#E6F1FB;--red:#791F1F;--redbg:#FCEBEB;--amb:#633806;--ambbg:#FAEEDA;--grn:#085041;--grnbg:#E1F5EE;--hl:#FAC775}
body.field{--bg:#1C1C1B;--card:#2C2C2A;--line:#444441;--tx:#F1EFE8;--tx2:#B4B2A9;--acc:#B5D4F4;--accbg:#0C447C;--red:#FCEBEB;--redbg:#791F1F;--amb:#FAC775;--ambbg:#633806;--grn:#9FE1CB;--grnbg:#085041;--hl:#854F0B}
@media(prefers-color-scheme:dark){body.learn{--bg:#1C1C1B;--card:#2C2C2A;--line:#444441;--tx:#F1EFE8;--tx2:#B4B2A9;--acc:#B5D4F4;--accbg:#0C447C;--red:#F7C1C1;--redbg:#501313;--amb:#FAC775;--ambbg:#412402;--grn:#9FE1CB;--grnbg:#04342C;--hl:#854F0B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body.field{font-size:17px}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
.seg{flex:1;display:flex;gap:3px;padding:3px;background:var(--card);border-radius:10px}
.seg button{flex:1;border:0;background:none;color:var(--tx2);font:inherit;font-size:15px;padding:8px 0;border-radius:8px}
.seg button.on{background:var(--tx);color:var(--bg);font-weight:600}
.ib{flex:none;width:42px;height:42px;border:0;border-radius:10px;background:var(--card);color:var(--tx);display:flex;align-items:center;justify-content:center}
.ib svg{width:22px;height:22px}
@media(max-width:360px){header{gap:6px;padding-left:8px;padding-right:8px}.ib{width:38px}.seg button{font-size:14px}}
main{max-width:720px;margin:0 auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:4px 4px max(4px,env(safe-area-inset-bottom))}
#nav a{flex:1;max-width:144px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--tx2);text-decoration:none;font-size:11px;border-radius:10px}
#nav a svg{width:22px;height:22px}
#nav a.on{color:var(--acc);font-weight:700;background:var(--accbg)}
h3{scroll-margin-top:72px}
.row small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.role .rs{display:block;opacity:.85;font-size:12px;margin-top:2px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.toc button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:16px;padding:6px 12px;font:inherit;font-size:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tcard{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);text-decoration:none;min-height:120px}
.tcard small{color:var(--tx2);font-size:13px;line-height:1.35}
.tcard .prog{margin-top:auto}
.tz{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 6px;border-radius:9px;background:var(--line);color:var(--tx);font-weight:800;margin-bottom:4px;align-self:flex-start}
.prog-card{display:block;color:var(--tx);text-decoration:none}
.esme{border-left:4px solid var(--acc)}.esme ul{margin:6px 0 0;padding-left:18px}.esme li{margin:4px 0}
.ind{margin:8px 0;font-size:15px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.col{min-width:0}.colh{background:var(--tx);color:var(--bg);border-radius:10px;padding:8px 10px;text-align:center}.colh b{display:block;font-size:16px}.colh small{font-size:12px;opacity:.8}.col .dose{padding:10px;margin:6px 0}.col .dose .big{font-size:17px}.col .dose .lb{font-size:13px}
.warn.wl ul{margin:4px 0 0;padding-left:18px}.warn.wl li{margin:5px 0}
details.alt{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;margin:10px 0}
details.alt summary{cursor:pointer;font-weight:600}details.alt ul{margin:6px 0 0;padding-left:18px}details.alt li{margin:5px 0}
details.card summary{cursor:pointer}
.vbox{margin:8px 0 14px}
.vthumb{background:#000 center/cover no-repeat;cursor:pointer;display:block;border:0;width:100%}
.vthumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:44px;border-radius:12px;background:rgba(200,0,0,.9);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
.vcap b{display:block;font-size:15px;line-height:1.3}.vcap small{display:block;color:var(--tx2);font-size:13px}
.brand{display:flex;align-items:center;gap:10px;margin:2px 0 6px}.brand img{height:40px;width:auto}.brand span{font-size:13px;color:var(--tx2);line-height:1.3}
.lg-l{display:none}body.learn .lg-d{display:none}body.learn .lg-l{display:inline}
@media(prefers-color-scheme:dark){body.learn .lg-d{display:inline}body.learn .lg-l{display:none}}
.steps{counter-reset:st;list-style:none;padding:0;margin:8px 0}.steps li{counter-increment:st;position:relative;padding:8px 0 8px 40px;border-bottom:1px solid var(--line)}.steps li::before{content:counter(st);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--accbg);color:var(--acc);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.qr{display:block;width:180px;height:180px;margin:10px auto;border-radius:10px;background:#fff;padding:6px}
.lead{font-size:16px;margin:10px 0}
.figs{display:grid;gap:10px;margin:10px 0}.fig{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.fig img{display:block;width:100%;height:auto}.fig figcaption{background:var(--card);color:var(--tx);padding:8px 10px;font-size:14px}.fig figcaption small{display:block;color:var(--tx2);font-size:11px;margin-top:2px}
.vmp4{background:linear-gradient(135deg,#0C447C,#1C1C1B)}.vmp4 .vt{position:absolute;left:12px;right:12px;top:10px;color:#fff;font-size:14px;font-weight:600;text-align:left}.video video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.pn{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.pn .btn{text-decoration:none;text-align:center}
h1{font-size:21px;margin:4px 0 10px;line-height:1.25}
h2{font-size:14px;font-weight:600;color:var(--tx2);margin:18px 0 8px}
h3{font-size:16px;margin:16px 0 4px}
p{margin:6px 0} a{color:var(--acc)} ul,ol{padding-left:20px}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);text-decoration:none;font:inherit;text-align:left}
.row small{display:block;color:var(--tx2);font-size:13px}
.row .ar{margin-left:auto;color:var(--tx2);font-size:20px}
.row.esc{background:var(--redbg);color:var(--red);border-color:var(--redbg);font-weight:600}
.row.esc .ar{color:var(--red)}
.card{padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.role{display:block;border-radius:12px;padding:14px 6px;text-align:center;text-decoration:none}
.role b{display:block;font-size:30px;line-height:1.1}
.role small{font-size:13px}
.rA{background:#0C447C;color:#B5D4F4}.rB{background:#085041;color:#9FE1CB}.rC{background:#712B13;color:#F5C4B3}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit;font-size:15px}
.tabs button.on{background:var(--tx);color:var(--bg)}
.ck{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.bx{flex:none;width:26px;height:26px;border:2px solid var(--tx2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:transparent}
.ck.on .bx{background:#1D9E75;border-color:#1D9E75;color:#04342C}
.ck.on .t{color:var(--tx2);text-decoration:line-through}
.ck.key .t{font-weight:600}
.ck ul{margin:4px 0 0;padding-left:18px;color:var(--tx2);font-size:15px}
.prog{height:6px;background:var(--line);border-radius:3px;margin:6px 0 4px}.prog i{display:block;height:6px;width:0;background:#1D9E75;border-radius:3px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;margin:4px 4px 0 0;background:var(--line);color:var(--tx)}
.tag.amb{background:var(--ambbg);color:var(--amb)}.tag.red{background:var(--redbg);color:var(--red)}.tag.grn{background:var(--grnbg);color:var(--grn)}
.warn{background:var(--ambbg);color:var(--amb);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
.dose{background:var(--accbg);color:var(--acc);border-radius:12px;padding:12px;margin:8px 0}
.dose .lb{font-size:14px}.dose .big{font-size:22px;font-weight:700;line-height:1.3}
.dose.tc{background:var(--grnbg);color:var(--grn)}.dose ul{margin:4px 0 0;padding-left:18px;font-weight:600}
details.warn summary{cursor:pointer;font-weight:600}details.warn ul{margin:6px 0 0;padding-left:18px}details.warn li{margin:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{flex:1;min-width:40px;border:1px solid var(--tx2);background:none;color:var(--tx);border-radius:10px;padding:10px 0;font:inherit}
.chips button.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:700}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv b{color:var(--tx2);font-size:14px;font-weight:600}
.tw{overflow-x:auto;margin:8px 0}.tw table{min-width:520px}
table{border-collapse:collapse;width:100%;font-size:14px} td,th{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=search]{width:100%;font-size:18px}
mark{background:var(--hl);color:inherit;border-radius:3px}
.muted{color:var(--tx2);font-size:14px}
.video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:var(--line);margin:8px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;font:inherit}
#fb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#fb[hidden]{display:none}
html.fbopen,html.fbopen body{overflow:hidden}
.fbp{background:var(--bg);color:var(--tx);width:100%;max-width:720px;max-height:94vh;max-height:94dvh;overflow:auto;overscroll-behavior:contain;border-radius:16px 16px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:760px){#fb{align-items:center}.fbp{border-radius:16px;max-height:90vh}}
.fbhd{display:flex;align-items:center;gap:8px;position:sticky;top:-10px;background:var(--bg);padding:6px 0;z-index:1}.fbhd h1{flex:1;margin:0;font-size:19px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:18px;padding:8px 12px;font:inherit;font-size:14px}
.opts button.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
.opts button.krit.on{background:var(--redbg);color:var(--red);border-color:var(--red)}
.fl{display:block;margin:14px 0 4px;font-weight:600;font-size:15px}
textarea{display:block;width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.fbp input{width:100%}
.fbsel{margin-top:8px;font-size:14px}
.shots{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.shot{position:relative;width:86px;height:130px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--tx2);text-align:center;padding:4px}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.shot button{position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:18px;line-height:1}
.shotb{display:flex;gap:8px;flex-wrap:wrap}.shotb .btn{flex:1;text-align:center;cursor:pointer;font-size:15px}
.btn.pri{display:block;width:100%;margin-top:14px;background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700;font-size:17px;padding:12px}
.btn.pri:disabled{opacity:.6}
#fb-msg.err{color:var(--red);font-weight:600}
.hp{position:absolute!important;left:-9999px;width:1px!important;height:1px;opacity:0}
.fbok{text-align:center;padding:18px 4px 6px}.fbok h1{font-size:20px}.fbic{width:56px;height:56px;margin:4px auto 8px;border-radius:50%;background:var(--grnbg);color:var(--grn);font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center}
.fbrow{display:block;width:100%;margin-top:18px;text-align:center}
/* ── įrankiai: 9-Line, MIST kortelė, GKS, TST (tools.js) ── */
:root{--ok:#1D9E75;--abn:#B42318;--mkr:#fff;--bfill:#ECEAE3;--bline:#8F8D85;--sMc:#B42318;--sMb:#FDECEA;--sMf:#7A1F1F;--sIc:#B35300;--sIb:#FFF1DF;--sIf:#6B3300;--sSc:#1D5FB4;--sSb:#E6F0FC;--sSf:#0C447C;--sTc:#18794E;--sTb:#E2F4EA;--sTf:#085041}
body.field{--abn:#FF9B91;--mkr:#F1EFE8;--bfill:#3F3F3B;--bline:#A3A198;--sMb:#4A1714;--sMf:#FFD9D4;--sIb:#472A06;--sIf:#FFD9A6;--sSb:#11304F;--sSf:#CFE3FA;--sTb:#0F3B28;--sTf:#BDEBCB}
@media(prefers-color-scheme:dark){body.learn{--abn:#FF9B91;--mkr:#F1EFE8;--bfill:#3F3F3B;--bline:#A3A198;--sMb:#4A1714;--sMf:#FFD9D4;--sIb:#472A06;--sIf:#FFD9A6;--sSb:#11304F;--sSf:#CFE3FA;--sTb:#0F3B28;--sTf:#BDEBCB}}
.btn{min-height:44px}.btn:disabled{opacity:.5}
.btn.sm{padding:8px 12px;font-size:14px;min-height:40px}
.btn.dng{color:var(--red);border-color:var(--red);background:none}
.seg2{display:flex;gap:3px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px}
.seg2 button{flex:1;border:0;background:none;color:var(--tx2);font:inherit;font-size:15px;padding:9px 0;border-radius:9px;min-height:42px}
.seg2 button.on{background:var(--tx);color:var(--bg);font-weight:600}
.nlprog{margin:0 0 12px}
section.nl,section.outp,.tfc{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px;margin:0 0 10px}
section.nl.req{border-left:4px solid var(--amb)}
section.nl.ok{border-left:4px solid var(--ok)}
.nlh{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.nlh b{flex:1;line-height:1.25}
.nn{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:8px;background:var(--line);color:var(--tx);font-weight:800;display:flex;align-items:center;justify-content:center}
section.nl.ok .nn{background:var(--ok);color:#fff}
.rq{flex:none;font-size:11px;font-weight:700;color:var(--amb);background:var(--ambbg);border-radius:6px;padding:2px 6px;text-transform:uppercase;letter-spacing:.3px}
section.nl.ok .rq{display:none}
section.nl>.muted{margin:0 0 6px}
.inp{display:block;width:100%;margin:6px 0;min-height:44px}
.in3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.in3 .inp{min-width:0;padding-left:10px;padding-right:8px}
@media(max-width:380px){.in3{grid-template-columns:1fr 1fr}.in3 .inp:last-child{grid-column:span 2;margin-top:0}}
.in2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
section.nl label,.mc label{display:block;font-size:13px;color:var(--tx2);min-width:0}
section.nl label .inp,.mc label .inp{font-size:17px;color:var(--tx)}
.lbl{font-size:13px;color:var(--tx2);margin:10px 0 4px;font-weight:600}
.lbl0{display:block;font-size:13px;color:var(--tx2);margin-bottom:6px}
.stp{display:grid;grid-template-columns:1fr 48px 40px 48px;align-items:center;gap:4px;padding:6px 0;border-bottom:1px solid var(--line)}
.stp:last-child{border-bottom:0}
.stp b{display:block;font-weight:600;font-size:15px;line-height:1.25}.stp small{display:block;color:var(--tx2);font-size:12px}
.stp button,.tlr button{height:44px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;font-size:24px;line-height:1;font-weight:600;padding:0}
.stp .sv,.tlr .sv{text-align:center;font-size:20px;font-weight:800}
.opts{margin:6px 0}.opts button{min-height:40px;text-align:left}
.opts button small{font-size:11px;opacity:.75;font-weight:700}
.outp pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 4px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--tx)}

.x{flex:none;width:44px;height:44px;border:1px solid var(--line);background:none;color:var(--tx2);border-radius:8px;font-size:20px;line-height:1;padding:0}
details.alt .tw table{font-size:13px}
[data-nl=l1]{text-transform:uppercase}[data-nl=l1]::placeholder{text-transform:none}
.mt0{margin-top:0}
/* MIST kortelė */
.mc{border:2px solid var(--tx);border-radius:16px;background:var(--card);overflow:hidden;margin:0 0 12px}
.mch{display:flex;align-items:baseline;gap:10px;background:var(--tx);color:var(--bg);padding:8px 14px}.mch b{font-size:22px;letter-spacing:4px;font-weight:900}.mch span{font-size:13px;opacity:.85}
.mcid{padding:10px 12px 4px;border-bottom:2px solid var(--tx)}
.mcid .chips button{min-height:44px;padding:8px 0}
